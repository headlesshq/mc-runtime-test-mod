---
name: Lifecycle

"on":
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      dirs:
        description: Comma-delimited directories to build and run (i.e. api,versions/1_20,versions/1_21 )
        default: "all"
      ref:
        description: Git ref to checkout before build (i.e. my-feature-branch )
        default: "main"

concurrency: # FIXME: prevent release commit cancellation
  group: >
    ${{ github.workflow }}-
    ${{ github.event_name }}-
    ${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - if: github.event_name == 'push' # TODO: explicit on push to main
        id: release-please
        name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  matrices:
    if: github.event.action != 'closed'
    name: Construct matrices
    needs: release-please
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.matrices.outputs.build-matrix }}
      run-matrix: ${{ steps.matrices.outputs.run-matrix }}
    steps:
      - name: Checkout 
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.ref }}

      - if: github.event_name != 'workflow_dispatch'
        id: paths
        name: Get paths
        run: |
          { delimiter="$(openssl rand -hex 8)"
          echo "filter<<${delimiter}"
          # top level projects (e.g. the api) and the Minecraft version projects in versions/
          for dir in $(find . versions -mindepth 1 -maxdepth 1 -type d -not -path "./.git*" -not -path ./versions -print | sed 's|^\./||'); do
            echo "'$dir' : ['$dir/**']"
          done; echo "${delimiter}"; } >> "${GITHUB_OUTPUT}"
          echo "${GITHUB_OUTPUT}"
          cat "${GITHUB_OUTPUT}" || true

      - if: github.event_name != 'workflow_dispatch'
        id: filter
        name: Filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ${{ steps.paths.outputs.filter }}

      - id: matrices # TODO: build origin matrices dynamically, consider collapsing this into a .py
        name: Construct matrices
        run: |
          import os
          import json
          import copy

          build_matrix = {"include": []}
          run_matrix = {"version": []}

          with open('ci-data.json') as f:
              ci_data = json.load(f)
          
          build_data = ci_data['build_data']
          run_data = ci_data['run_data']

          dirs_to_filter = []
          mc_versions = []

          match os.getenv('GITHUB_EVENT_NAME'):
            case 'pull_request':
              if "${{ steps.filter.outcome }}" == "success":
                # Filter matrices based on the detected changes
                dirs_to_filter = json.loads('${{ steps.filter.outputs.changes }}')

            case 'workflow_dispatch':
              input_dirs = '${{ github.event.inputs.dirs }}'
              print(input_dirs)
              if input_dirs == 'all':
                # If "all" is specified in the input, run all possible builds and runs
                build_matrix['include'], run_matrix['version'] = build_data, run_data
                print(build_matrix)
                print(run_matrix)
              else:
                # Otherwise, filter based on the directories listed in the input
                dirs_to_filter = [item.strip() for item in input_dirs.split(',')]

            case 'push':
              if '${{ needs.release-please.outputs.release_created }}' == 'true':
                # If a release is created, use the full matrices
                build_matrix['include'], run_matrix['version'] = build_data, run_data

          if dirs_to_filter:
            build_matrix['include'].extend([item for item in build_data if item["dir"] in dirs_to_filter and ("mc" not in item or (item["mc"] in mc_versions or not mc_versions))])
            mc_versions = mc_versions if mc_versions else [item.get("mc") for item in build_matrix["include"] if "mc" in item]
            run_matrix['version'].extend([item for item in run_data if item["mc"] in mc_versions])

          for entry in run_matrix['version']:
            entry['runner'] = 'ubuntu-latest' #'blacksmith-2vcpu-ubuntu-2204'
            entry['cache'] = 'github' #'blacksmith'
            entry['xvfb'] = True
          
          additional_runs = []
          for item in run_matrix['version']:
            #runners = [ ('blacksmith-2vcpu-ubuntu-2204', 'blacksmith') ] # also add non-xvfb runs for ubuntu
            runners = [ ('ubuntu-latest', 'github') ] # also add non-xvfb runs for ubuntu
            if len(additional_runs) < 9: # add other runners only for the latest version * 3 modloaders * 3 runners
              runners += [ ('windows-latest', 'github'), ('macos-latest', 'github') ]
            for runner, cache in runners:
              entry = copy.deepcopy(item)
              entry['runner'] = runner
              entry['cache'] = cache
              entry['xvfb'] = False
              additional_runs.append(entry)
          
          run_matrix['version'] += additional_runs
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
            print(json.dumps(build_matrix, indent=2))
            fh.write(f'build-matrix={json.dumps(build_matrix)}\n')
            print(json.dumps(run_matrix, indent=2))
            fh.write(f'run-matrix={json.dumps(run_matrix)}\n')
        shell: python {0}

  build:
    if: fromJSON(needs.matrices.outputs.build-matrix).include[0] != null
    name: Build
    needs: matrices
    strategy:
      fail-fast: false
      matrix:
        ${{ insert }}: ${{ fromJSON(needs.matrices.outputs.build-matrix) }}
    uses: ./.github/workflows/flex-build.yml
    with:
      dir: ${{ matrix.dir }}
      mc: ${{ matrix.mc }}
      lex: ${{ matrix.lex }}
      neo: ${{ matrix.neo }}
      java: ${{ matrix.java }}

  run:
    if: github.event_name != 'push' && fromJSON(needs.matrices.outputs.run-matrix).version[0] != null
    name: Run tests
    needs:
      - matrices
      - build
    runs-on: ${{ matrix.version.runner }}
    strategy:
      fail-fast: false
      matrix:
        ${{ insert }}: ${{ fromJSON(needs.matrices.outputs.run-matrix) }}
    steps:
      - name: Checkout # TODO: simplify away this step, currently needed for `uses: ./`
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: jars-${{ matrix.version.mc }}

      - name: Bootstrap mods
        run: |
          mkdir -p run/mods
          cp mc-runtime-test-*-${{ matrix.version.type }}-release.jar run/mods

      - name: Setup Github Java temurin-${{ matrix.version.java }}
        if: matrix.version.cache == 'github'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: ${{ matrix.version.java }}
          distribution: temurin

      - name: Setup Blacksmith Java temurin-${{ matrix.version.java }}
        if: matrix.version.cache == 'blacksmith'
        uses: useblacksmith/setup-java@4ef812391eff6e9737ba13bf0356d0f702877a64 # v5
        with:
          java-version: ${{ matrix.version.java }}
          distribution: temurin

      - name: Run game
        timeout-minutes: 3
        uses: headlesshq/mc-runtime-test@2245d6fb52a7b889d2266798da17deba4c3a5813
        with:
          cache-mc: ${{ matrix.version.cache }}
          mc: ${{ matrix.version.mc }}
          mc-runtime-test: none
          modloader: ${{ matrix.version.modloader }}
          regex: ${{ matrix.version.regex }}
          java: ${{ matrix.version.java }}
          xvfb: ${{ matrix.version.xvfb }}
          headlessmc-command: --retries 3 --jvm -Djava.awt.headless=true

  release:
    if: needs.release-please.outputs.release_created == 'true'
    needs:
      - release-please
      - build
    name: Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8

      - name: Upload release artifacts
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: jars-*/*-release.jar
          tag: ${{ needs.release-please.outputs.tag_name }}
          overwrite: true
          file_glob: true

      - name: Upload api artifacts
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: jars-*/*-api-*.jar # TODO: make API jar names consistent with release jars, then simplify away this step
          tag: ${{ needs.release-please.outputs.tag_name }}
          overwrite: true
          file_glob: true

  clean: # TODO: run this conditionally per #22
    name: Clean up
    needs:
      - run
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: |
            jars-*
          failOnError: false
