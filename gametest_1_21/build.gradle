plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.3.10-SNAPSHOT'
}

// A mod that registers gametests the same way regular mods do in production,
// without any mc-runtime-test specific hacks. Used to regression test
// https://github.com/headlesshq/mc-runtime-test/issues/119, #120 and #121.

group 'me.earth'
version "$minecraft_version-${project(':api').project_version}"

base {
    archivesName = 'clientgametest'
}

sourceSets {
    fabric
    neoforge
    lexforge
}

repositories {
    mavenCentral()
    maven {
        url = "https://maven.neoforged.net/releases"
    }
    maven {
        url = "https://files.minecraftforge.net/maven"
    }
    maven {
        name = "sponge"
        url = "https://repo.spongepowered.org/maven"
    }
    maven {
        url = "https://maven.wagyourtail.xyz/releases"
    }
    maven {
        url = "https://maven.fabricmc.net/"
    }
}

unimined.minecraft {
    version project.minecraft_version

    mappings {
        mojmap()
        devFallbackNamespace "mojmap"
    }

    defaultRemapJar = false
}

unimined.minecraft(sourceSets.fabric) {
    combineWith(sourceSets.main)

    fabric {
        loader project.fabric_version
    }

    defaultRemapJar = true
}

unimined.minecraft(sourceSets.neoforge) {
    combineWith(sourceSets.main)

    neoForged {
        loader project.neoforge_version
    }

    minecraftRemapper.config {
        ignoreConflicts(true)
    }

    defaultRemapJar = true
}

unimined.minecraft(sourceSets.lexforge) {
    combineWith(sourceSets.main)

    minecraftForge {
        loader project.lexforge_version
    }

    minecraftRemapper.config {
        ignoreConflicts(true)
    }

    defaultRemapJar = true
}

processFabricResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

processNeoforgeResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

processLexforgeResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(org.gradle.jvm.tasks.Jar).configureEach {
    manifest {
        attributes(
            'Implementation-Title': 'GameTest',
            'Implementation-Version': project.version,
        )
    }
}
